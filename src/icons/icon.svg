<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A54926"/>
      <stop offset="100%" stop-color="#8C3B1E"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Base Icon Background -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)"/>

  <!-- Inner Stone Board Plate -->
  <circle cx="256" cy="256" r="190" fill="#D9CBB0" stroke="#B9A98A" stroke-width="10" filter="url(#shadow)"/>

  <!-- Traditional Karnataka Board Lines -->
  <!-- Triangle / Diamond Grid Lines -->
  <path d="M 256 100 L 396 360 L 116 360 Z" fill="none" stroke="#5A4630" stroke-width="7" stroke-linejoin="round"/>
  <path d="M 256 100 L 256 360" stroke="#5A4630" stroke-width="7"/>
  <path d="M 186 230 L 326 230" stroke="#5A4630" stroke-width="7"/>
  <path d="M 116 360 L 326 230" stroke="#5A4630" stroke-width="5" stroke-dasharray="2 0"/>
  <path d="M 396 360 L 186 230" stroke="#5A4630" stroke-width="5" stroke-dasharray="2 0"/>

  <!-- Board Nodes -->
  <circle cx="256" cy="100" r="14" fill="#B9A98A" stroke="#5A4630" stroke-width="4"/>
  <circle cx="186" cy="230" r="14" fill="#B9A98A" stroke="#5A4630" stroke-width="4"/>
  <circle cx="326" cy="230" r="14" fill="#B9A98A" stroke="#5A4630" stroke-width="4"/>
  <circle cx="116" cy="360" r="14" fill="#B9A98A" stroke="#5A4630" stroke-width="4"/>
  <circle cx="256" cy="360" r="14" fill="#B9A98A" stroke="#5A4630" stroke-width="4"/>
  <circle cx="396" cy="360" r="14" fill="#B9A98A" stroke="#5A4630" stroke-width="4"/>

  <!-- Hero Tiger Piece at Apex (256, 100) -->
  <circle cx="256" cy="155" r="46" fill="#C2410C" stroke="#FFFFFF" stroke-width="7" filter="url(#shadow)"/>
  <text x="256" y="174" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="900" fill="#FFFFFF">T</text>

  <!-- Hero Goat Pieces at Base -->
  <circle cx="186" cy="340" r="34" fill="#F5F0E6" stroke="#5A4630" stroke-width="5" filter="url(#shadow)"/>
  <text x="186" y="354" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="40" font-weight="900" fill="#5A4630">G</text>

  <circle cx="326" cy="340" r="34" fill="#F5F0E6" stroke="#5A4630" stroke-width="5" filter="url(#shadow)"/>
  <text x="326" y="354" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="40" font-weight="900" fill="#5A4630">G</text>
</svg>
